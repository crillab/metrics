[project]
name = "crillab-metrics"
version = "1.3.0"
description = "rEproducible sofTware peRformance analysIs in perfeCt Simplicity"
keywords = ["reproducible software performance analysis"]
readme = "README.md"
authors = [
    { name = "Thibault Falque, Romain Wallon, Hugues Wattez" },
    { email = "metrics@cril.fr" },
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: GNU Lesser General Public License v3 or later (LGPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.8",
]
dependencies = [
    "InquirerPy",
    "crillab-autograph",
    "dash-bootstrap-components",
    "deprecated",
    "jinja2",
    "jsonpickle",
    "loguru",
    "myst-parser",
    "pandas",
    "pyfiglet",
    "pyparsing",
    "pyyaml",
    "tenacity",
]
license = { text = "LGPLv3+" }
requires-python = ">=3.10"

[project.urls]
Homepage = "https://github.com/crillab/metrics"

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[project.extras]
sat = ["gbd-tools"]
minizinc = ["mzn-bench"]

[tool.pdm.build]
includes = ["bin/*", "metrics/*"]

[tool.scripts]
metrics = "bin/metrics"

[tool.pyinstaller]
# Fichier à encapsuler
script = "bin/metrics"
# Inclure l'ensemble des modules et sous-packages du package metrics
paths = ["metrics"]
# Inclure l'interpréteur Python dans le fichier résultat
onefile = true

# Options supplémentaires pour la génération des packages
[tool.pyinstaller.datas]
# Ajoutez ici les fichiers de données supplémentaires à inclure dans le package

# Génération des packages supplémentaires
[tool.pyinstaller.deploy]
# Génération d'un package Debian
deb = true
# Génération d'un package Snapcraft
snap = true
# Génération d'un package Homebrew
homebrew = true
# Génération d'un package Chocolatey
chocolatey = true

# Options pour le packaging
[tool.pyinstaller.options]
# Ajoutez ici d'autres options de configuration PyInstaller selon vos besoins
